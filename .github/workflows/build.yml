---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build

permissions:
  contents: read

jobs:
  phpunit:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@e3e99bd1c54fb350911bf446690e6146acf7660d # v2.0.6
    with:
      composer-command: require yiisoft/yii2:22.0.x-dev
      concurrency-group: phpunit-${{ github.workflow }}-${{ github.ref }}
      extensions: intl, mbstring, sodium
      ignore-platform-reqs-php-version: "[8.6]"
      php-version: "[8.3, 8.4, 8.5, 8.6]"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  phpunit-compatibility:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@e3e99bd1c54fb350911bf446690e6146acf7660d # v2.0.6
    with:
      composer-command: require yiisoft/yii2:2.0.55
      concurrency-group: phpunit-compatibility-${{ github.workflow }}-${{ github.ref }}
      extensions: intl, mbstring, sodium
      ignore-platform-reqs-php-version: "[8.6]"
      php-version: "[8.3, 8.4, 8.5, 8.6]"
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
